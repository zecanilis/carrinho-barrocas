<!doctype html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Carrinho Barrocas</title>
<meta name="theme-color" content="#C2410C">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Carrinho">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--ink:#3E2723;--muted:#6D4C41;--acc:#C2410C;--acc2:#9A3412;--peach:#FFE4D1;--ground:#FFF8F0;--line:#F0DFD0;--green:#2E7D32;--red:#C62828;--orange:#E65100;
  --safe-b:env(safe-area-inset-bottom,0px);--safe-t:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--ground);color:var(--ink);font-family:'Nunito',system-ui,-apple-system,sans-serif;font-size:16px}
body{min-height:100dvh;overscroll-behavior-y:none}
#app{max-width:560px;margin:0 auto;min-height:100dvh;position:relative}
a{color:var(--acc)}
button,input,select{font:inherit;color:inherit}
h1,h2,h3{margin:0}
.ic{flex:none}
.screen{padding:calc(12px + var(--safe-t)) 18px 24px;display:flex;flex-direction:column;gap:12px}
.pad-nav{padding-bottom:calc(150px + var(--safe-b))}
.pad-fab{padding-bottom:calc(110px + var(--safe-b))}
.pad-bottom{padding-bottom:calc(110px + var(--safe-b))}
.padx{padding:4px 4px 120px}
.row{display:flex;align-items:center}.between{justify-content:space-between}.end{align-items:flex-end}.start{align-items:flex-start}.wrap{flex-wrap:wrap}
.gap6{gap:6px}.gap8{gap:8px}.gap10{gap:10px}.grow{flex:1;min-width:0}.full{width:100%}
.stack{display:flex;flex-direction:column;gap:12px}.stack8{display:flex;flex-direction:column;gap:8px}.stack20{display:flex;flex-direction:column;gap:20px}.stack0{display:flex;flex-direction:column}
.center{align-items:center;text-align:center}.right{align-items:flex-end}.left{text-align:left}
.muted{color:var(--muted)}.ink{color:var(--ink)}.small{font-size:13px}.b6{font-weight:600}.b7{font-weight:700}.b8{font-weight:800}.o9{opacity:.9}
.nolink{text-decoration:none}
.big{font-size:30px;font-weight:800;line-height:1.15}.h3{font-size:20px;font-weight:800}.xl{font-size:32px;font-weight:800}
.hero{display:flex;flex-direction:column;gap:4px;padding:16px 4px 4px}.hero.row{flex-direction:row}
.top{display:flex;align-items:center;gap:6px;margin:0 -8px}
.top h1{font-size:24px;font-weight:800;line-height:1.2;overflow-wrap:anywhere}
.iconbtn{width:44px;height:44px;border:none;background:transparent;border-radius:14px;display:flex;align-items:center;justify-content:center;color:var(--ink);cursor:pointer;flex:none}
.iconbtn.soft{background:#fff;color:var(--acc)}
.txtbtn{border:none;background:none;color:var(--acc);font-weight:800;font-size:15px;padding:10px 12px;text-decoration:none;cursor:pointer;flex:none}
.sqbtn{width:48px;height:48px;border-radius:16px;background:var(--acc);color:#fff;display:flex;align-items:center;justify-content:center}
.card{background:#fff;border-radius:20px;padding:18px;box-shadow:0 2px 0 var(--line)}
.card.peach{background:var(--peach);box-shadow:none}
.card.warn{background:#FFF3CD;box-shadow:none;font-size:15px;line-height:1.45}
.btn{display:flex;align-items:center;justify-content:center;gap:10px;border:none;background:var(--acc);color:#fff;font-weight:800;font-size:17px;padding:16px 18px;border-radius:16px;cursor:pointer;text-decoration:none;min-height:52px}
.btn:disabled{background:#D7CCC8;color:#5D4037;cursor:default}
.btn.ghost{background:#fff;color:var(--ink);border:1px solid var(--line)}
.btn.red{background:var(--red)}
.gbtn{gap:12px;font-size:16px}
.pill{font-size:12px;font-weight:800;color:var(--acc);background:var(--peach);padding:4px 10px;border-radius:999px}.pill.ok{color:var(--green);background:#E3F1E4}
.bar{height:8px;border-radius:999px;background:var(--line);overflow:hidden}.bar i{display:block;height:100%;background:var(--acc);border-radius:999px}.bar i.ok{background:var(--green)}
.bar.light{background:rgba(255,255,255,.3)}.bar.light i{background:#fff}
.listcard{display:flex;flex-direction:column;gap:12px;text-decoration:none;color:var(--ink)}
.av{border-radius:999px;color:#fff;font-weight:800;display:inline-flex;align-items:center;justify-content:center;flex:none;border:2px solid #fff}
.avs{display:inline-flex}.avs .av+.av{margin-left:-8px}
.avbox{display:flex;padding:5px;border-radius:999px;background:#fff}
.summary{background:var(--acc);color:#fff;border-radius:22px;padding:18px;display:flex;flex-direction:column;gap:12px}
.sec{margin:10px 4px 0;font-size:13px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.item{display:flex;align-items:center;gap:12px;padding:12px 14px;background:#fff;border-radius:18px}
.item.done{background:#F7F2EC}.item.done .iname{text-decoration:line-through;color:#8D6E63}
.iname{font-size:16px;font-weight:700}
.stepper{display:flex;align-items:center;gap:4px}
.sbtn{width:36px;height:36px;border:none;border-radius:12px;background:var(--peach);color:var(--acc);display:flex;align-items:center;justify-content:center;cursor:pointer}
.qty{width:52px;text-align:center;font-size:16px;font-weight:800;border:1px solid transparent;border-radius:10px;background:transparent;padding:6px 2px}
.qty:focus{border-color:var(--acc);background:#fff;outline:none}
.un{font-size:13px;color:var(--muted);margin-right:2px}
.tot{display:flex;flex-direction:column;align-items:flex-end}.tot small{font-size:12px;color:var(--muted)}
.tick{width:42px;height:42px;border-radius:999px;border:2px solid #A1887F;background:#fff;display:flex;align-items:center;justify-content:center;color:#fff;cursor:pointer;flex:none}
.tick.on{background:var(--green);border-color:var(--green)}.tick.on.acc{background:var(--acc);border-color:var(--acc)}
.tick.sm{width:34px;height:34px}
.fab{position:fixed;right:max(20px,calc(50% - 260px));bottom:calc(28px + var(--safe-b));width:64px;height:64px;border-radius:22px;background:var(--acc);color:#fff;display:flex;align-items:center;justify-content:center;border:none;box-shadow:0 6px 16px rgba(194,65,12,.35);cursor:pointer;z-index:5}
.fab.wide{width:auto;height:auto;padding:16px 22px;gap:8px;border-radius:999px;font-weight:800;font-size:17px;bottom:calc(92px + var(--safe-b))}
.nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:#fff;border-top:1px solid var(--line);padding-bottom:var(--safe-b);z-index:6;max-width:560px;margin:0 auto}
.nav a{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:10px 0 12px;text-decoration:none;color:var(--muted);font-size:13px;font-weight:600}
.nav a.on{color:var(--acc);font-weight:800}
.search{display:flex;align-items:center;gap:10px;padding:0 16px;height:50px;background:#fff;border-radius:16px;border:1px solid var(--line);color:var(--muted)}
.search input{flex:1;border:none;outline:none;background:transparent;font-size:16px;color:var(--ink);min-width:0}
.tabs{display:flex;gap:8px;overflow-x:auto;padding:2px 0 4px;scrollbar-width:none;margin:0 -18px;padding-inline:18px}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;border:none;font-size:14px;font-weight:800;padding:10px 16px;border-radius:999px;background:#fff;color:var(--ink);cursor:pointer}
.tab.on{background:var(--ink);color:#fff}
/* no computador (rato): os separadores passam para várias linhas em vez de deslizar */
@media (min-width:960px){#app,.nav,.bottombar{max-width:880px}.fab{right:calc(50% - 420px)}}
@media (hover:hover) and (pointer:fine){.tabs{flex-wrap:wrap;overflow:visible;margin:0;padding:2px 0 4px}.tab:hover{background:var(--peach)}.tab.on:hover{background:var(--ink)}}
.prow{display:flex;align-items:center;gap:12px;padding:12px 14px;background:#fff;border-radius:16px;border:none;width:100%;text-align:left;cursor:pointer;min-height:60px}
.prow.static{cursor:default}.prow.sel{background:var(--peach)}.prow:disabled{cursor:default;opacity:1}
.prow small{font-size:13px}
.price{min-width:78px;text-align:right;font-size:15px}
.inlist{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:800;color:var(--green)}
.bottombar{position:fixed;left:0;right:0;bottom:0;padding:14px 18px calc(18px + var(--safe-b));background:var(--ground);border-top:1px solid var(--line);z-index:6;max-width:560px;margin:0 auto}
.bottombar .btn{width:100%}a.btn{text-decoration:none}
.empty{display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;padding:40px 20px;color:var(--muted)}
.hint{text-align:center;font-size:12px;color:var(--muted);margin:4px 0}
.field{display:flex;flex-direction:column;gap:8px;font-size:14px;font-weight:700;color:var(--muted);border:none;padding:0;margin:0}
.field legend{padding:0;margin-bottom:8px}
.field input,.field select{font-size:18px;font-weight:700;color:var(--ink);padding:14px 16px;border:1px solid var(--line);border-radius:16px;background:#fff;outline:none;width:100%;appearance:none}
.field input:focus,.field select:focus{border:2px solid var(--acc);padding:13px 15px}
.code{letter-spacing:.12em;text-transform:uppercase}
.seg{display:flex;gap:8px}.seg label{flex:1;position:relative}.seg input{position:absolute;opacity:0;left:0;top:0;width:1px;height:1px;margin:0}
.seg span{display:block;text-align:center;font-size:16px;font-weight:800;padding:14px;border-radius:14px;border:1px solid var(--line);background:#fff;color:var(--ink);cursor:pointer}
.seg input:checked+span{border:2px solid var(--acc);background:var(--peach);color:var(--acc);padding:13px}
.seg input:focus-visible+span{outline:2px solid var(--ink)}
.check{display:flex;align-items:center;gap:12px;padding:14px 16px;background:#fff;border-radius:16px;font-size:15px}
.check input{width:22px;height:22px;accent-color:var(--acc);flex:none}
.check span{display:flex;flex-direction:column;gap:2px}.check small{color:var(--muted);font-size:13px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:#fff;font-size:15px;font-weight:700;padding:10px 16px;border-radius:999px;cursor:pointer}
.mitem{display:flex;align-items:center;gap:14px;width:100%;padding:16px;border:none;border-radius:16px;background:#fff;font-size:16px;font-weight:700;cursor:pointer;text-align:left}
.mitem.red{color:var(--red)}
.qr{width:200px;height:200px;background:#fff;border-radius:16px;padding:8px;display:flex;align-items:center;justify-content:center}
.qr svg{width:100%;height:100%}
.code-big{font-size:30px;font-weight:800;letter-spacing:.14em}
.num{width:28px;height:28px;flex:none;border-radius:999px;background:var(--peach);color:var(--acc);font-weight:800;font-size:14px;display:flex;align-items:center;justify-content:center}
.install{font-size:15px;line-height:1.4}
.demo{background:#FFF3CD;color:#5D4037;font-size:13px;font-weight:700;text-align:center;padding:8px calc(12px + var(--safe-t)) 8px;padding-top:calc(8px + var(--safe-t))}
.onb{padding-top:calc(40px + var(--safe-t));gap:18px}
.logo{width:76px;height:76px;border-radius:24px;background:var(--acc);color:#fff;display:flex;align-items:center;justify-content:center}
.lead{font-size:17px;line-height:1.45;margin:0}
details summary{cursor:pointer;font-size:16px}
.loading{min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;color:var(--acc);padding:24px;text-align:center}
.loading span{color:var(--muted)}
/* deslizar */
.sw{position:relative;border-radius:18px;overflow:hidden;touch-action:pan-y}.sw-act{visibility:hidden}.sw.open .sw-act,.sw.moving .sw-act{visibility:visible}
.sw-act{position:absolute;right:0;top:0;bottom:0;display:flex;width:96px}.sw-act.two{width:176px}
.act{flex:1;border:none;color:#fff;font-size:13px;font-weight:800;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;text-decoration:none;cursor:pointer}
.act.red{background:var(--red)}.act.orange{background:var(--orange)}
.sw-front{position:relative;transition:transform .2s ease;user-select:none;-webkit-user-select:none}
.sw .sw-front{border-radius:inherit}
/* folhas e diálogos */
.overlay{position:fixed;inset:0;background:rgba(62,39,35,.45);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.overlay.center{align-items:center;padding:24px}
.sheet{position:relative;width:100%;max-width:560px;background:var(--ground);border-radius:28px 28px 0 0;padding:12px 22px calc(26px + var(--safe-b));animation:up .2s ease}
.sheet h2{font-size:24px;font-weight:800}
.xclose{position:absolute;top:14px;right:14px;width:40px;height:40px;border-radius:999px;border:0;background:#EFE5DD;color:inherit;display:grid;place-items:center;cursor:pointer}.xclose:active{transform:scale(.94)}
.grab{width:44px;height:5px;border-radius:999px;background:#D7CCC8;margin:0 auto 14px}
.dialog{width:100%;max-width:400px;background:var(--ground);border-radius:26px;padding:24px 20px 18px;display:flex;flex-direction:column;gap:12px;align-items:center;text-align:center}
.dialog h2{font-size:21px;font-weight:800}.dialog p{margin:0;font-size:16px;line-height:1.45}
.dico{width:62px;height:62px;border-radius:999px;background:#FDE2E1;color:var(--red);display:flex;align-items:center;justify-content:center}
@keyframes up{from{transform:translateY(40px);opacity:.4}}
#toast{position:fixed;left:50%;bottom:calc(100px + var(--safe-b));transform:translate(-50%,20px);background:var(--ink);color:#fff;padding:12px 18px;border-radius:14px;font-weight:700;font-size:15px;opacity:0;pointer-events:none;transition:.2s;z-index:30;max-width:90vw;text-align:center}
#toast.show{opacity:1;transform:translate(-50%,0)}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
/* PDF / impressão */
#print{display:none}
@media print{
  @page{size:A4;margin:16mm}
  body{background:#fff}
  #app,.overlay,#toast,.nav,.fab{display:none!important}
  #print{display:block;color:#3E2723;font-family:'Nunito',sans-serif}
  #print .ph{display:flex;justify-content:space-between;align-items:flex-end;border-bottom:3px solid #C2410C;padding-bottom:10px;margin-bottom:6px}
  #print h1{font-size:28pt;font-weight:800}#print .r{display:flex;flex-direction:column;align-items:flex-end;gap:2px}
  #print small{color:#6D4C41;font-size:9pt}
  #print h3{margin:12px 0 2px;font-size:9pt;font-weight:800;color:#C2410C;text-transform:uppercase;letter-spacing:.08em;break-after:avoid}
  #print .pl{display:flex;align-items:center;gap:10px;padding:5px 0;border-bottom:1px dotted #D7CCC8;font-size:11pt;break-inside:avoid}
  #print .pl.hd{font-size:8pt;font-weight:800;color:#6D4C41;border:0}
  #print .bx{width:12px;height:12px;border:1.5px solid #3E2723;border-radius:3px;flex:none;font-size:9pt;line-height:10px;text-align:center}
  #print .nm{flex:1}#print .q{width:70px;text-align:right;color:#6D4C41}#print .v{width:75px;text-align:right;font-weight:700}
  #print .pf{display:flex;justify-content:space-between;align-items:center;border-top:2px solid #3E2723;margin-top:14px;padding-top:8px;font-size:13pt}
}

.grp{background:#fff;border-radius:16px;overflow:hidden}.grp>*+*{border-top:1px solid var(--line)}.grp.fechada{display:none}
.grp .sw{border-radius:0}.grp .prow{border-radius:0;min-height:46px;padding:8px 12px 8px 14px;gap:10px}
.prow .iname{font-size:15px}.prow .pr{font-size:13px;white-space:nowrap}.prow.na .iname{color:#8D6E63}.prow.na .pr{color:var(--green);font-weight:800}
.lrowi{display:flex;align-items:center;gap:8px;padding:6px 8px 6px 14px;background:#fff;min-height:48px}
.lrowi .nm{min-width:0;display:flex;align-items:center;gap:6px}.lrowi .iname{font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lrowi.done{background:#F7F2EC}.lrowi.done .iname{text-decoration:line-through;color:#8D6E63}
.stepper.sm{gap:2px}.stepper.sm .sbtn{width:30px;height:30px;border-radius:9px}.stepper.sm .qty{width:36px;font-size:15px;padding:4px 0}.stepper.sm .un{font-size:11px;color:var(--muted);margin-right:2px}
.lp{min-width:58px;text-align:right;font-size:14px;white-space:nowrap}
.tick.xs{width:28px;height:28px;border-width:2px}
.summary.slim{position:sticky;top:0;z-index:5;padding:10px 14px;border-radius:14px;gap:6px;font-size:14px}.summary .lg{font-size:20px;font-weight:800}.bar.thin{height:5px}
.secbtn{display:flex;width:100%;align-items:center;justify-content:space-between;background:none;border:none;cursor:pointer;padding:6px 4px 0;font-family:inherit;text-align:left}
.chev{font-size:14px;transition:transform .15s}.chev.fe{transform:rotate(-90deg)}
.curcard{display:flex;flex-direction:column;gap:8px;background:var(--acc);color:#fff;border-radius:22px;padding:16px 18px;text-decoration:none}
.sw.big-sw{border-radius:22px}.curname{font-size:26px;font-weight:800;line-height:1.15;overflow-wrap:anywhere}.curtot{font-size:24px;font-weight:800;white-space:nowrap}
.openbtn{background:#fff;color:var(--acc);border-radius:999px;padding:6px 14px;font-weight:800}
.lrow{display:flex;align-items:center;gap:10px;padding:12px 14px;background:#fff;color:var(--ink);text-decoration:none;min-height:48px}
.secsel{height:50px;border-radius:16px;border:none;background:var(--ink);color:#fff;font:inherit;font-weight:800;font-size:14px;padding:0 10px;max-width:46%;flex:none}
.search.grow{min-width:0}
</style>
</head>
<body>
<div id="app"></div>
<div id="print" aria-hidden="true"></div>
<script type="module" src="app.js"></script>
</body>
</html>
